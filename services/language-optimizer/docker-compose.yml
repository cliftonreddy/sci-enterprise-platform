version: "3.9"

services:
  graalvm-optimizer:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: graalvm-optimizer
    ports:
      - "8000:8000"       # Web UI + API
    env_file:
      - .env              # ANTHROPIC_API_KEY=sk-ant-...
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - CODEBERT_DIR=/app/models/codebert
    volumes:
      # Generated polyglot packages are written here
      - ./optimized:/app/optimized
      # CodeBERT model weights (download once to C:\GreenSoftware\models\codebert)
      - C:\GreenSoftware\models\codebert:/app/models/codebert:ro
      # Docker socket — allows the optimizer to build/run benchmark containers
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
