version: "3.8"
services:
  language-optimizer:
    build:
      context: ./services/language-optimizer
      dockerfile: Dockerfile
    container_name: sci-language-optimizer
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - CODEBERT_DIR=/app/models/codebert
      - ENABLE_TIER2=${ENABLE_TIER2:-true}
      - AI_PROVIDER=${AI_PROVIDER:-anthropic}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o}
      - OLLAMA_URL=${OLLAMA_URL:-}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3}
    volumes:
      - ${CODEBERT_MODEL_DIR:-codebert-models}:/app/models/codebert
    ports:
      - "8000:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: sci-enterprise-backend
    environment:
      - WATTTIME_USER=${WATTTIME_USER:-}
      - WATTTIME_PASS=${WATTTIME_PASS:-}
      - ELECTRICITY_MAPS_TOKEN=${ELECTRICITY_MAPS_TOKEN:-}
      - GRID_PROVIDER=${GRID_PROVIDER:-electricitymaps}
      - KUBECONFIG=/app/kubeconfig/kube.yml
      - KUBECTL_PATH=/usr/local/bin/kubectl
      - PROMETHEUS_POD=${PROMETHEUS_POD:-ucp-metrics}
      - GA4_PROPERTY_ID=${GA4_PROPERTY_ID:-}
      - GOOGLE_APPLICATION_CREDENTIALS=/app/ga4-credentials.json
      - ADO_ORG=${ADO_ORG:-}
      - ADO_ORGS=${ADO_ORGS:-}
      - ADO_PAT=${ADO_PAT:-}
      - ADO_PROJECTS=${ADO_PROJECTS:-}
      - LANGUAGE_OPTIMIZER_URL=http://language-optimizer:8000
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
    volumes:
      - ./data:/app/data:ro
      - ${KUBECONFIG_DIR:-./ucp-bundle}:/app/kubeconfig:ro
      - ${GA4_CREDENTIALS_FILE:-./ga4-service-account.json}:/app/ga4-credentials.json:ro
    ports:
      - "5000:5000"
    depends_on:
      - language-optimizer
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: sci-enterprise-frontend
    ports:
      - "3000:8080"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  codebert-models:
